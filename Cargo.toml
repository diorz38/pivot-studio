[workspace]
resolver = "2"
members = [
    "crates/pivot-core",
    "crates/pivot-data",
    "crates/pivot-theme",
    "crates/pivot-export",
    "crates/pivot-app",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Pivot Studio contributors"]

[workspace.dependencies]
# UI (decision #1) - egui/eframe; confirm/adjust exact versions in Phase 0 as needed.
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Data ingest (decision #2, Phase 1). Confirm versions/features as integration proceeds.
csv = "1"
calamine = "0.32" # upgraded from 0.26 (0.26.1 failed to compile in this toolchain)
dbase = "0.6"     # upgraded from 0.5 baseline
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rfd = "0.15"
rust_xlsxwriter = "0.79"
tempfile = "3"
printpdf = "0.7"
# Database + credentials (decision #2, #4, Phase 5)
rusqlite = { version = "0.32", features = ["bundled"] }
mysql = "26"
keyring = { version = "3", features = ["apple-native","windows-native","linux-native"] }
# Workspace persistence (decision #5, Phase 7)
zip = { version = "2", default-features = false, features = ["deflate"] }

pivot-core = { path = "crates/pivot-core" }
pivot-data = { path = "crates/pivot-data" }
pivot-theme = { path = "crates/pivot-theme" }
pivot-export = { path = "crates/pivot-export" }


