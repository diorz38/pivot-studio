[workspace]
resolver = "2"
members = [
    "crates/pivot-core",
    "crates/pivot-data",
    "crates/pivot-theme",
    "crates/pivot-export",
    "crates/pivot-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Pivot Studio contributors"]

[workspace.dependencies]
# UI (decision #1) - egui/eframe; confirm/adjust exact versions in Phase 0 as needed.
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

pivot-core = { path = "crates/pivot-core" }
pivot-data = { path = "crates/pivot-data" }
pivot-theme = { path = "crates/pivot-theme" }
pivot-export = { path = "crates/pivot-export" }
