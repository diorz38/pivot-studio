[workspace]
resolver = "2"
members = [
    "crates/pivot-core",
    "crates/pivot-data",
    "crates/pivot-theme",
    "crates/pivot-export",
    "crates/pivot-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Pivot Studio contributors"]

[workspace.dependencies]
# UI (decision #1) - egui/eframe; confirm/adjust exact versions in Phase 0 as needed.
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Data ingest (decision #2, Phase 1). Confirm versions/features as integration proceeds.
csv = "1"
calamine = "0.32" # upgraded from 0.26 (0.26.1 failed to compile in this toolchain)
dbase = "0.6"     # upgraded from 0.5 baseline
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rfd = "0.15"

pivot-core = { path = "crates/pivot-core" }
pivot-data = { path = "crates/pivot-data" }
pivot-theme = { path = "crates/pivot-theme" }
pivot-export = { path = "crates/pivot-export" }
